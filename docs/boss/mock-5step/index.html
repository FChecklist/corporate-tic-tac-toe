</style></head><body>
<header><div class="logo">T</div><b>Corporate Tambola</b><span id="who">Organizer</span></header>
<div class="trust" role="note">🔒 <b>No personal details needed.</b> <span>All participant information is deleted within 24 hours of the game.</span></div>
<main>
<div class="steps" id="steps" role="list" aria-label="Steps"></div>
<div id="view"></div><div id="demo"></div>
</main>
<div class="bar"><div class="in"><button class="btn sec2" id="back">Back</button><div class="grow" id="hint"></div><button class="btn" id="next">Next</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const COL=['var(--blue)','var(--aqua)','var(--violet)','var(--mag)','var(--green)'];
const NAMES=['Date and time','Who are you creating this game for','Tickets and prizes','Brand & Breaks','Check and publish','Game dashboard'];
const PACKS=[10,100,250,500,1000,2500,5000,10000];
const S={idk:'emp',step:1,day:'Today',time:'4 pm',occ:'Team party',card:null,how:null,people:'',fam:'4',list:'',size:null,sizeManual:false,prize:'Classic',brand:'',hosts:[],cohosts:[],published:false};
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function listCount(){return analyse(S.idk==='email').filter(x=>!x.dup&&!x.bad).length}
function perPerson(){return S.card==='fam'?1+Number(S.fam):1}
function need(){const l=listCount();if(S.how==='system'&&l)return l*perPerson();const p=Number(S.people);return p?p*perPerson():0}
function pack(n){return PACKS.find(p=>p>=n)||PACKS[PACKS.length-1]}
function curSize(){return S.sizeManual&&S.size?S.size:(need()?pack(need()):null)}
const SHORT=['Date and time','Who is it for','Tickets & prizes','Brand & Breaks','Publish','Dashboard'];
function steps(){if(S.role==='cohost'){$('#steps').innerHTML='';return}$('#steps').innerHTML=NAMES.slice(0,5).map((n,i)=>`<button role="listitem" aria-label="Step ${i+1}: ${n}" style="--c:${COL[i]}" class="tab ${i+1===S.step?'on':(i+1<S.step||S.step===6?'done':'')}" onclick="go(${i+1})"><i></i><span><b>Step ${i+1}</b> <em>${SHORT[i]}</em></span></button>`).join('')+`<button class="dashbtn ${S.step===6?'on':''} ${S.published||!STRICT?'':'lock'}" onclick="go(6)" aria-label="Game dashboard">Game dashboard${S.published||!STRICT?'':' 🔒'}</button>`}
function tidy(){if(S.how==='system'){const it=analyse(S.idk==='email');S.ign={d:it.filter(x=>x.dup).length,b:it.filter(x=>x.bad&&!x.dup).length};S.list=it.filter(x=>!x.dup&&!x.bad).map(x=>x.v).join(NL)}}
function go(n){if(S.role==='cohost')return;if(S.step===2&&n>2){tidy()}if(STRICT&&n===6&&!S.published){toast('Your game page opens after you publish');return}if(STRICT&&n>S.step){for(let k=1;k<n;k++){if(!ok(k)){S.step=k;render();toast('Please finish this step first');return}}}S.step=n;render()}
const STRICT=new URLSearchParams(location.search).get('strict')==='1';
function ok(n){return STRICT?okStrict(n):true}
function okStrict(n){if(n===5){const h=emails(S.hostTxt),c=emails(S.coTxt);if(h.length>5||h.some(x=>x.bad)||c.some(x=>x.bad))return false}if(n===2&&S.how==='system'&&listCount()<1)return false;if(n===1)return !!(S.occ.trim()&&S.day&&S.time);if(n===2)return S.card&&S.how&&curSize();return true}
const CARDS={ppl:['🏢','Your people','For staff, associates, contract staff and everyone who works with you, in any location.'],fam:['👨‍👩‍👧','Your people and their families','Your people, in any location, any place, and their families too. Everyone gets 1 ticket of their own (1 + 4), plus 4 more to share with their family members.'],ext:['🤝','Extended family','For your people, vendors, customers and friends of the company, wherever they are, whichever location they are in. The people in the game can bring a few more.']};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NOW=new Date();
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dl(d,y){return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+(y?' '+d.getFullYear():'')}
const DAYS=[0,1,2,3,4].map(n=>{const d=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+n);return{iso:iso(d),label:(n===0?'Today, ':n===1?'Tomorrow, ':'')+dl(d)}});
const TIMES=[['10 am',10,0],['12 pm',12,0],['4 pm',16,0],['6 pm',18,0],['7 pm',19,0]];
const ZONES=[['IST','Asia/Kolkata'],['Dubai','Asia/Dubai'],['Singapore','Asia/Singapore'],['UK','Europe/London'],['Europe','Europe/Paris'],['US East','America/New_York'],['US West','America/Los_Angeles'],['Australia','Australia/Sydney']];
function off(ms,tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)),g=t=>+f.find(x=>x.type===t).value;return Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))-ms}
function utcOf(isoD,h,m,tz){if(!isoD)return null;const[a,b,c]=isoD.split('-').map(Number),guess=Date.UTC(a,b-1,c,h,m);return guess-off(guess-off(guess,tz),tz)}
function tzName(){const z=ZONES.find(x=>x[1]===S.tz);return z?z[0]:S.tz.split('/').pop().replace(/_/g,' ')}
function fmt12(h,m){return(h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+' '+(h<12?'am':'pm')}
function passed(t){const u=utcOf(S.iso,t[1],t[2],S.tz);return u!==null&&u<=Date.now()}
S.iso=DAYS[0].iso;S.day=DAYS[0].label;S.tz='Asia/Kolkata';S.hh=null;S.mm=0;
(function(){const t=TIMES.find(t=>!passed(t))||TIMES[0];S.time=t[0];S.hh=t[1]})();
function chip(txt,on,act,dis){return`<button class="chip" aria-pressed="${on}" ${dis?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="${act}">${txt}${dis?' (passed)':''}</button>`}
function others(){if(!S.iso||S.hh===null)return'';const u=utcOf(S.iso,S.hh,S.mm,S.tz);if(u===null)return'';
return ZONES.filter(z=>z[1]!==S.tz).slice(0,6).map(z=>{const f=new Intl.DateTimeFormat('en-GB',{timeZone:z[1],hour:'numeric',minute:'2-digit',hour12:true,weekday:'short'}).format(new Date(u));return`<span class="pill">${z[0]} ${f.replace(',','')}</span>`}).join('')}
function view1(){const occ=['Diwali','Team party','Annual day','Customer event','Family day'];
const known=ZONES.some(z=>z[1]===S.tz);
return`<p class="crumb">Step 1 of 5</p><h1>When are you planning this online team engagement activity?</h1><p class="sub">Pick the occasion, day and time. The system has already filled in popular choices, so you can simply check and press Next.</p>
<div class="sec" id="s-occ"><h2>Occasion</h2><div class="chips">${occ.map(o=>chip(o,!S.occO&&S.occ===o,`S.occ='${o}';S.occO=false;render('s-day')`)).join('')}${chip('Other',S.occO,"S.occO=true;S.occ='';render('oo')")}</div>
${S.occO?`<label for="oo">Name your occasion</label><input id="oo" maxlength="60" placeholder="For example, Founders' day" value="${S.occ}" oninput="S.occ=this.value;foot()">`:''}</div>
<div class="sec" id="s-day"><h2>Day and date</h2><div class="chips">${DAYS.map(o=>chip(o.label,!S.dayO&&S.iso===o.iso,`S.iso='${o.iso}';S.day='${o.label}';S.dayO=false;render('s-time')`)).join('')}${chip('Other date',S.dayO,"S.dayO=true;S.iso='';S.day='';render('od')")}</div>
${S.dayO?`<label for="od">Pick a date</label><input id="od" type="date" min="${DAYS[0].iso}" value="${S.iso}" onchange="pickDate(this.value)"><div class="note ok" id="dayShow">${S.day?'✓ '+S.day+' '+S.iso.slice(0,4):'Choose a date and the day shows here'}</div>`:''}</div>
<div class="sec" id="s-time"><h2>Time</h2><div class="chips">${TIMES.map(t=>chip(t[0],!S.timeO&&S.time===t[0],`S.time='${t[0]}';S.hh=${t[1]};S.mm=${t[2]};S.timeO=false;render('s-zone')`,passed(t))).join('')}${chip('Other time',S.timeO,"S.timeO=true;S.time='';S.hh=null;render('ot')")}</div>
${S.timeO?`<label for="ot">Pick a time</label><input id="ot" type="time" onchange="pickTime(this.value)">`:''}</div>
<div class="sec" id="s-zone"><h2>Time zone</h2><div class="chips">${ZONES.map(z=>chip(z[0],S.tz===z[1],`S.tz='${z[1]}';S.zoneO=false;render('s-sum')`)).join('')}${chip('Other',S.zoneO||!known,"S.zoneO=true;render('oz')")}</div>
${(S.zoneO||!known)?`<label for="oz">Choose a time zone</label><select id="oz" onchange="S.tz=this.value;render()">${Intl.supportedValuesOf('timeZone').map(z=>`<option value="${z}" ${z===S.tz?'selected':''}>${z.replace(/_/g,' ')}</option>`).join('')}</select>`:''}
<div class="note" id="s-sum" style="margin-top:12px"><b>${S.day||'Pick a date'}${S.time?', '+S.time:''} ${tzName()}</b>${S.time&&S.iso?`<div style="margin-top:6px">Your people in other places will see: ${others()}</div>`:''}</div></div>`}
function pickDate(v){if(!v){S.iso='';S.day='';foot();return}const d=new Date(v+'T00:00');S.iso=v;S.day=dl(d);document.getElementById('dayShow').textContent='✓ '+dl(d,true);foot();jump('s-time')}
function pickTime(v){if(!v){S.time='';S.hh=null;foot();return}const[h,m]=v.split(':').map(Number);S.hh=h;S.mm=m;S.time=fmt12(h,m);render('s-zone');setTimeout(()=>{const e=document.getElementById('ot');if(e)e.value=v},0)}
function sizeBox(){const n=need();if(!n)return`<div class="note">Tell us roughly how many people, and the system will suggest a size.</div>`;const sz=curSize();const l=listCount();
const why=S.sizeManual?'You chose this size.':(S.how==='system'&&l?`Worked out from your ${l} people${S.card==='fam'?`, each with ${S.fam} family ticket${S.fam==1?'':'s'}`:''}, with a little room to spare.`:`You chose up to ${Number(S.people).toLocaleString('en-IN')} ${S.card==='fam'?`employees, 5 tickets each`:'people'}.`);
const small=S.sizeManual&&sz<(S.how==='system'&&listCount()?listCount()*perPerson():0);
return`<div class="size"><div><div class="why">Game size</div><big>${sz.toLocaleString('en-IN')} participants</big><div class="why">${why}</div></div><div><div class="why">Price</div><b>Shown here from your plan</b><div><button class="link" onclick="S.chg=!S.chg;render()">Change size</button></div></div></div>
${S.chg?`<div class="chips">${PACKS.map(p=>`<button class="chip" aria-pressed="${p===sz}" onclick="S.size=${p};S.sizeManual=true;S.chg=false;render()">${p===10?'Demo, 10 participants':p.toLocaleString('en-IN')}</button>`).join('')}</div>`:''}
${small?`<div class="note warn">Your list needs ${listCount()*perPerson()} participants. Please choose a bigger size.</div>`:''}
<div class="note">Everyone who plays is one participant. An employee with 4 family tickets is 5 participants.</div>`}
function view2(){const c=S.card;
let h=`<p class="crumb">Step 2 of 5</p><h1>Who are you creating this game for?</h1><p class="sub">Pick your group, and the system sets up the rest around them. You can change it any time.</p>
<div class="cards">${Object.entries(CARDS).map(([k,v])=>`<button class="card" aria-pressed="${c===k}" onclick="pick('${k}')"><span class="tick">✓</span><div class="ico">${v[0]}</div><h3>${v[1]}</h3><p>${v[2]}</p></button>`).join('')}</div>`;
if(c){h+=`<div class="sec" id="s-ask"><h2>${c==='fam'?'Roughly how many employees is this game for?':c==='ext'?'Roughly how many people do you expect to join in the fun?':'Roughly how many people is this game for?'}</h2>
<select aria-label="Number of people" onchange="S.people=this.value;S.sizeManual=false;upd();jump('s-how')">${(c==='fam'?[20,50,100,200,500,1000,2000]:[10,100,250,500,1000,2500,5000,10000]).map(n=>`<option value="${n}" ${String(S.people)===String(n)?'selected':''}>Up to ${n.toLocaleString('en-IN')} ${c==='fam'?'employees, '+(n*5).toLocaleString('en-IN')+' participants':(n===10?'people (a free demo)':'people')}</option>`).join('')}</select>
<div class="note" style="margin-top:8px">Pick the closest. You can change it any time.</div>${c==='fam'?`<div class="note"><b>Each employee gets 5 tickets:</b> 1 of their own and 4 for their family.</div>`:''}</div>
<div class="sec" id="s-how"><h2>How should the right people get in?</h2><div class="two">
<button class="opt" aria-pressed="${S.how==='system'}" onclick="S.how='system';render('s-list')"><b>System validates for you ${c!=='ext'?'<span class="rec">Recommended</span>':''}</b><small>You share a single, system-generated game link. The system does the rest.</small></button>
<button class="opt" aria-pressed="${S.how==='you'}" onclick="S.how='you';render('szbox')"><b>You validate yourself ${c==='ext'?'<span class="rec">Recommended</span>':''}</b><small>Nothing to add. People wait, and you let them in.</small></button></div></div>`;
if(S.how==='system'){const em=S.idk==='email';h+=`<div class="sec" id="s-list"><h2>Participants you want the system to validate</h2>
<label style="margin-top:0">System validation criteria</label>
<p class="sub" style="margin:0 0 10px">Choose which one you want. The system matches what each person enters against your list.</p>
<div class="chips" style="margin:0 0 12px"><button class="chip" aria-pressed="${!em}" onclick="S.idk='emp';resetList()">Employee ID</button><button class="chip" aria-pressed="${em}" onclick="S.idk='email';resetList()">Email ID</button></div>
<div class="safe"><b>🔒 No personal details (name, mobile) are taken from you.</b><ul><li>Only the ${em?'email IDs':'employee IDs'} you add are allowed to participate.</li><li>The system sends no email to your participants. You share the game link yourself.</li><li>All information is deleted within 24 hours of the game ending.</li></ul></div>
${S.review?reviewBox(em):`<label for="lst">Copy and paste the ${em?'employee email IDs':'employee IDs'} here, one on each line</label><div class="tip">Tip: ${em?'copy the employee email IDs from your Excel sheet or email list, and paste them here.':'copy the employee IDs from your Excel sheet, and paste them here.'}</div>
<textarea id="lst" placeholder="${em?'priya.sharma@acme.com&#10;rahul.verma@acme.co.in':'E1042&#10;E1043'}" oninput="S.list=this.value;S.sizeManual=false;upd()">${S.list}</textarea>
<div class="row" style="margin-top:8px;align-items:center"><span id="cnt" class="pill">${listCount()} participants added</span><button class="link" onclick="sample()">Try a sample</button></div>
<div class="row" style="margin-top:10px"><button class="btn sec2" onclick="if(S.list.trim()){S.review=true;S.rvPage=0;S.rvQ='';S.rvProb=false;render('s-review')}else toast('Add your list first')">Look at my list (optional)</button></div>
<div class="note" style="margin-top:14px;text-align:center"><b>or</b></div>
<div class="note"><b>Upload a file instead</b><div class="row" style="margin-top:8px;align-items:center"><input id="fil" type="file" accept=".csv,.txt" style="max-width:340px" onchange="readFile(this.files[0])"><button class="link" onclick="dlFormat()">Download the file format</button></div></div>
<div class="note">If someone new opens the game link, they wait politely until you let them in.</div>`}</div>`}
if(S.how==='you')h+=`<div class="note" style="margin-top:14px">Everyone who opens your game link will wait for you. You see their name and let them in one by one, or press <b>Let everyone in</b>.${c==='ext'?' People in the game can bring up to 4 more.':''}</div>`;
h+=`<div class="sec" id="szbox">${sizeBox()}</div>
`}
return h}

const NL=String.fromCharCode(10);
function listRows(){return S.list.split(NL).map(x=>x.trim()).filter(Boolean)}
function resetList(){S.list='';S.listOk=false;S.review=false;render()}
function chk(v,em){return em?/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v):/^[A-Za-z0-9._-]{2,30}$/.test(v)}
function analyse(em){const seen=new Set();return listRows().map(v=>{const k=v.toLowerCase(),dup=seen.has(k);seen.add(k);return{v,dup,bad:!chk(v,em)}})}
S.rvPage=0;S.rvQ='';S.rvProb=false;
function rvRows(){const em=S.idk==='email',it=analyse(em).map((x,i)=>({...x,n:i+1})),q=S.rvQ.trim().toLowerCase();let f=it.filter(x=>(!q||x.v.toLowerCase().includes(q))&&(!S.rvProb||x.dup||x.bad));const per=50,pages=Math.max(1,Math.ceil(f.length/per));if(S.rvPage>=pages)S.rvPage=pages-1;const sl=f.slice(S.rvPage*per,S.rvPage*per+per);
return`<div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)">${sl.map(x=>`<div style="display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)"><span style="min-width:40px;color:var(--mut)">${x.n}</span><span style="flex:1;word-break:break-all">${x.v.replace(/</g,'&lt;')}</span><span class="${x.dup||x.bad?'warn':'ok'}">${x.dup?'Repeated':x.bad?(em?'Not an email ID':'Check this ID'):'✓'}</span></div>`).join('')||'<div style="padding:12px;color:var(--mut)">Nothing found</div>'}</div>
<div class="row" style="margin-top:8px;align-items:center"><span class="tip" style="margin:0">Showing ${f.length?S.rvPage*per+1:0} to ${Math.min(f.length,S.rvPage*per+per)} of ${f.length}</span><span style="flex:1"></span><button class="btn sec2" ${S.rvPage<=0?'disabled':''} onclick="S.rvPage--;rvDraw()">Previous</button><button class="btn sec2" ${S.rvPage>=pages-1?'disabled':''} onclick="S.rvPage++;rvDraw()">Next page</button></div>`}
function rvDraw(){const e=document.getElementById('rvrows');if(e)e.innerHTML=rvRows()}
function reviewBox(em){const it=analyse(em),d=it.filter(x=>x.dup).length,b=it.filter(x=>x.bad&&!x.dup).length,good=it.length-d-b;
return`<div class="sec" id="s-review" style="margin-top:14px"><h2>Your list</h2><div class="note"><b>${good}</b> ${em?'email IDs':'employee IDs'} look right${d?`, <span class="warn">${d} repeated</span>`:''}${b?`, <span class="warn">${b} look wrong</span>`:''}. ${(d||b)?'Repeated and wrong ones are left out automatically.':'This is optional. You can continue without checking.'}</div>
<div class="row" style="margin:10px 0;align-items:center"><input style="flex:1;min-width:180px" placeholder="Search for an ${em?'email ID':'employee ID'}" oninput="S.rvQ=this.value;S.rvPage=0;rvDraw()" value="${S.rvQ.replace(/"/g,'&quot;')}" aria-label="Search the list">${(d||b)?`<label style="display:flex;gap:8px;align-items:center;margin:0;font-weight:400"><input type="checkbox" style="width:20px;height:20px" ${S.rvProb?'checked':''} onchange="S.rvProb=this.checked;S.rvPage=0;rvDraw()">Show only problems</label>`:''}</div>
<div id="rvrows">${rvRows()}</div>
<div class="row" style="margin-top:12px;align-items:center">${(d||b)?`<button class="btn sec2" onclick="cleanList()">Remove them now</button>`:''}<button class="btn" onclick="S.review=false;render('szbox')">Done</button><button class="link" onclick="S.review=false;render('s-list')">Edit the list</button></div></div>`}
function cleanList(){const em=S.idk==='email';S.list=analyse(em).filter(x=>!x.dup&&!x.bad).map(x=>x.v).join(NL);render()}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{let rows=String(r.result).split(NL).map(x=>x.split(',')[0].replace(/["\r]/g,'').trim()).filter(Boolean);if(rows.length&&/email|employee|\bid\b/i.test(rows[0])&&!chk(rows[0],S.idk==='email'))rows=rows.slice(1);S.list=rows.join(NL);S.sizeManual=false;S.review=true;S.listOk=false;render('s-review')};r.readAsText(f)}
function dlFormat(){const em=S.idk==='email',t=em?['Email ID','priya.sharma@acme.com','rahul.verma@acme.co.in']:['Employee ID','E1042','E1043'];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.join(NL)+NL],{type:'text/csv'}));a.download=em?'email-ids-format.csv':'employee-ids-format.csv';a.click();toast('Format file downloaded')}
function sample(){var NL=String.fromCharCode(10);S.list=S.idk==='email'?['priya.sharma@acme.com','rahul.verma@acme.co.in','neha.k@acme.com'].join(NL):['E1042','E1043','E1050'].join(NL);S.sizeManual=false;render()}

let LASTSTEP=0;
function render(t){const y=window.scrollY;steps();document.getElementById('demo').innerHTML=demoBox();$('#view').innerHTML=gbar()+(S.role?rolebar():'')+(S.role==='cohost'?viewCo():[null,view1,view2,view3,view4,view5,view6][S.step]());foot();if(S.step!==LASTSTEP){window.scrollTo(0,0);LASTSTEP=S.step}else window.scrollTo(0,y);if(typeof t==='string')jump(t)}
$('#next').onclick=()=>{if(S.step===5){S.published=true;S.paid=(curSize()===10);S.step=6;render();return}go(S.step+1)};
$('#back').onclick=()=>go(S.step-1);
if(!STRICT){S.card='ppl';S.how='system';S.idk='emp';S.people='250';S.list=Array.from({length:120},(_,k)=>'E'+(1001+k)).join(NL);S.sizeManual=false;}
const Q=new URLSearchParams(location.search);S.role=Q.get('role');S.who=Q.get('email')||'';
if(S.role){S.card='ppl';S.how='system';S.idk='emp';S.people='250';S.list=Array.from({length:180},(_,k)=>'E'+(1001+k)).join(NL);S.published=true;S.paid=false;S.step=6;S.hostTxt='host@acme.com';S.coTxt='cohost@acme.com';}
function rolebar(){if(!S.role)return'';const h=S.role==='host';return`<div class="rolebar"><span>${h?'🔑 You are a <b>Host</b>':'🤝 You are a <b>Co-host</b>'} of this game <em>${S.who.replace(/</g,'')}</em></span><button class="link" onclick="location.href='host.html'">Sign out</button></div>`+(h?`<div class="note ok" style="margin:0 0 14px">As a Host you can make any change in the game, just like the organizer, and you help run the game and let people in.</div>`:`<div class="note" style="margin:0 0 14px"><b>What you can do:</b> help bring people to the game and let them in. <b>What you cannot do:</b> change the game, its prizes, date or payment.</div>`)}
function viewCo(){const sz=curSize();return`<p class="crumb ok">Co-host</p><h1>Your Co-host page</h1><p class="sub">Help bring your team or location to the game.</p>${claimBanner()}
${shareTop()}
${waitBox()}
<div class="sec"><h2>Tickets claimed</h2><div class="note"><b>${S.joined} of ${sz.toLocaleString('en-IN')} participants have joined.</b> This updates live.<div class="bar2"><i style="width:${Math.min(100,Math.round(S.joined/sz*100))}%"></i></div></div></div>${boardPanel(false)}`}
render();
</script></body></html>
