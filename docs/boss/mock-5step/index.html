<header><div class="logo">T</div><b>Corporate Tambola</b><span id="who" class="who"></span></header>
<div class="trust" role="note">🔒 <b>No personal details needed.</b> <span>All participant information is deleted within 24 hours of the game.</span></div>
<main>
<div class="steps" id="steps" role="list" aria-label="Steps"></div>
<div id="view"></div><div id="demo"></div>

<div class="bar"><div class="in"><button class="btn sec2" id="back">Back</button><div class="grow" id="hint"></div><button class="btn" id="next">Next</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const COL=['var(--blue)','var(--aqua)','var(--violet)','var(--mag)','var(--green)'];
const NAMES=['Date and time','Who are you creating this game for','Tickets and prizes','Brand & Breaks','Check and publish','Game dashboard'];
const PACKS=[10,100,250,500,1000,2500,5000,10000];
const S={idk:'emp',step:1,day:'Today',time:'4 pm',occ:'Team party',card:null,how:null,people:'',fam:'4',list:'',size:null,sizeManual:false,prize:'Classic',brand:'',hosts:[],cohosts:[],published:false};
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function listCount(){return analyse(S.idk==='email').filter(x=>!x.dup&&!x.bad).length}

function need(){const l=listCount();if(S.how==='system'&&l)return l*perPerson();const p=Number(S.people);return p?p*perPerson():0}
function pack(n){return PACKS.find(p=>p>=n)||PACKS[PACKS.length-1]}
function curSize(){return S.sizeManual&&S.size?S.size:(need()?pack(need()):null)}
const SHORT=['Date and time','Who is it for','Tickets & prizes','Brand & Breaks','Publish','Dashboard'];
function steps(){if(S.role==='cohost'||S.role==='player'){$('#steps').innerHTML='';return}$('#steps').innerHTML=NAMES.slice(0,5).map((n,i)=>`<button role="listitem" aria-label="Step ${i+1}: ${n}" style="--c:${COL[i]}" class="tab ${i+1===S.step?'on':(i+1<S.step||S.step===6?'done':'')}" onclick="go(${i+1})"><i></i><span><b>Step ${i+1}</b> <em>${SHORT[i]}</em></span></button>`).join('')+`<button class="dashbtn ${S.step===6?'on':''} ${S.published||!STRICT?'':'lock'}" onclick="go(6)" aria-label="Game dashboard">Game dashboard${S.published||!STRICT?'':' 🔒'}</button>`}
function tidy(){if(S.how==='system'){const it=analyse(S.idk==='email');S.ign={d:it.filter(x=>x.dup).length,b:it.filter(x=>x.bad&&!x.dup).length};S.list=it.filter(x=>!x.dup&&!x.bad).map(x=>x.v).join(NL)}}
function go(n){if(S.role==='cohost')return;if(S.step===2&&n>2){tidy()}if(STRICT&&n===6&&!S.published){toast('Your game page opens after you publish');return}if(STRICT&&n>S.step){for(let k=1;k<n;k++){if(!ok(k)){S.step=k;render();toast('Please finish this step first');return}}}S.step=n;render()}
const STRICT=new URLSearchParams(location.search).get('strict')==='1';
function ok(n){return STRICT?okStrict(n):true}
function okStrict(n){if(n===5){const h=emails(S.hostTxt),c=emails(S.coTxt);if(h.length>5||h.some(x=>x.bad)||c.some(x=>x.bad))return false}if(n===2&&S.how==='system'&&listCount()<1)return false;if(n===1)return !!(S.occ.trim()&&S.day&&S.time);if(n===2)return S.card&&S.how&&curSize();return true}
const CARDS={ppl:['🏢','Your people','For staff, associates, contract staff and everyone who works with you, in any location.'],fam:['👨‍👩‍👧','Your people and their families','Your people, in any location, any place, and their families too. Everyone gets their own ticket and 4 Family Passes (1 + 4) to share with friends and family. The person who shares a pass approves who joins.'],ext:['🤝','Extended family','For your people, vendors, customers and friends of the company, wherever they are, whichever location they are in. The people in the game can bring a few more.']};

const TIMES=[['10 am',10,0],['12 pm',12,0],['4 pm',16,0],['6 pm',18,0],['7 pm',19,0]];

(function(){const t=TIMES.find(t=>!passed(t))||TIMES[0];S.time=t[0];S.hh=t[1]})();

return paFrame(`<div class="pa-msg ${m[0]}"><span class="e">${m[1]}</span><div>${m[2]}</div></div>${mini()}${paTickets(true)}<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="pa-link" onclick="pgo('claim','check')">Checking</button><button class="pa-link" onclick="pgo('claim','ok')">Correct</button><button class="pa-link" onclick="pgo('claim','wrong')">Not correct</button><button class="pa-link" onclick="pgo('claim','late')">Too late</button><button class="pa-link" onclick="pgo('claim','taken')">Already taken</button></div>`,true)}
if(sc==='reconnect')return paFrame(`<div class="pa-msg chk"><span class="e">📶</span><div><b>Reconnecting…</b><br>Your ticket is safe. This page reconnects by itself.</div></div>${mini()}${paTickets(true)}`,true);
if(sc==='back')return paFrame(`<div class="pa-msg ok"><span class="e">✓</span><div><b>Back online.</b></div></div>${mini()}${paTickets(true)}${paPrizes()}`,true);
if(sc==='away')return paFrame(`<div class="pa-msg chk"><span class="e">👋</span><div><b>Welcome back!</b><br>You were away for 6 numbers. They are marked on your ticket.</div></div>${mini()}${paTickets(true)}`,true);
if(sc==='rehearsal')return paFrame(`<div class="pa-msg chk"><span class="e">🧪</span><div><b>Game ID: ${S.gid}-R1<br>REHEARSAL GAME 1</b><br>This link and this game are for rehearsal only. The real game has a different link and a different game.</div></div>${mini()}${paTickets(true)}`,true);
if(sc==='ended')return paFrame(`<div class="pa-card" style="text-align:center"><h3>Thank you for playing! 🎉</h3><p>The game is over. Thank you for joining <b>${coName('your company')}</b>. Your organizer will tell you about the prizes.</p><div class="pa-small">Everything about you is deleted within 24 hours of the game.</div></div>${paTickets(true)}`,true);
if(sc==='famjoin')return paFrame(`<div class="pa-card" style="text-align:center"><div class="pa-spin">⏳</div><h3>Welcome! 👋</h3><p><b>Priya</b> shared a family pass with you for the Corporate Tambola game on <b>${when}</b>. Priya is your family host.</p><p>Please wait while your family host approves your entry. This page opens your ticket by itself.</p><div class="pa-small">No name or mobile number is needed.</div><button class="pa-link" onclick="pgo('famok')">Show me when Priya approves</button></div>`);
if(sc==='famok')return paFrame(`<div class="pa-msg ok"><span class="e">✓</span><div><b>You are in!</b><br>Your family host approved your entry.</div></div>${paTickets(false)}${nm}<button class="pa-btn alt" onclick="pgo('live')">Show me the live game</button>`);
return paFrame('<div class="pa-card"><p>Screen not found.</p></div>')}
function playerView(){return themeBar()+pScreen()}

S.theme=(new URLSearchParams(location.search).get('theme')==='modern')?'modern':'retro';document.documentElement.setAttribute('data-pt',S.theme);S.team='';function coName(d){return(S.brand||d||'Your company').replace(/</g,'')+(S.team?' (Team - '+S.team.replace(/</g,'')+')':'')}
function setTheme(t){S.theme=t;document.documentElement.setAttribute('data-pt',t);render()}
function themeBar(){return`<div class="thbar">Design: <button class="${S.theme==='retro'?'on':''}" onclick="setTheme('retro')">Retro</button><button class="${S.theme==='modern'?'on':''}" onclick="setTheme('modern')">Modern</button></div>`}

S.cwL=9;
function pPrz(mode,n2){const names=prizeNames().slice(0,5);const gold=mode==='gold'||mode==='sent';const won=n2?[0,1]:[0];
return`<div class="pa-card pzc"><h3>PRIZES</h3>${names.map((x,i)=>{const g=gold&&won.includes(i);const sent=mode==='sent'&&g;return`<div class="pa-prz"><div>${x}${g&&!sent&&S.pmanual!==true?`<small>Claim in the next ${S.cwL} s</small>`:''}${sent?'<small>Claim sent. Checking…</small>':''}</div><button class="${g?'pa-gold':'pa-grey'}" ${sent?'disabled':''} onclick="${g?"pgo('claimsent')":"pgo('bogey')"}">${sent?'SENT':'CLAIM'}</button></div>`}).join('')}</div>`}
function pAlert(n2){const t=n2?'You have won the Early Five and the Top Line. Click CLAIM to claim.':'You have won the Early Five. Click CLAIM to claim.';return`<div class="pa-alert"><div class="at">${t}</div><button class="pa-gold big" onclick="pgo('claimsent')">CLAIM</button>${S.pmanual!==true?`<div class="aq">Claim in the next ${S.cwL} s</div>`:''}</div>`}
function pSticky(sent){return`<div class="pa-sticky">${sent?'<span class="sent">Claim sent. Checking…</span>':`<button class="pa-gold big" onclick="pgo('claimsent')">CLAIM</button>${S.pmanual!==true?`<span class="aq">Claim in the next ${S.cwL} s</span>`:''}`}</div>`}
function pMini(winner,sent){const rt=sent?'<span style="color:#ffd56a">Claim sent</span>':winner?(S.pmanual!==true?`Claim in the next <b>${S.cwL} s</b>`:'Claim before the next number'):`next in <b>${S.tm} s</b>`;
return`<div class="pa-mini3"><div class="l"><span>Last 5</span><b>${S.hist.slice(-5).reverse().slice(1).join(' ')}</b></div><div class="c"><span class="mb">${S.last}</span></div><div class="r"><b>${CALLED.length}</b> of 90 called<br>${rt}</div></div><div class="pa-bar thin"><i style="width:${Math.round(CALLED.length/90*100)}%"></i></div>`}
function pToast(t,cls){return`<div class="pa-toast ${cls||''}">${t}</div>`}
function addSticky(h,x){return h.replace(/<\/div><\/div><\/div>$/,x+'</div></div></div>')}
function addOverlay(h,x){return h.replace(/<\/div><\/div>$/,x+'</div></div>')}
function paScreenNew(){const sc=S.pscreen;
if(sc==='live')return paFrame(`${pMini(false)}${paTickets(true)}${paFam()}${pPrz('grey')}`,true);
if(sc==='claimwin'||sc==='claimwin2'){const n2=sc==='claimwin2';return addSticky(paFrame(`${pAlert(n2)}${pMini(true)}${paTickets(true)}${pPrz('gold',n2)}`,true),pSticky(false))}
if(sc==='claimwinman'){S.pmanual=true;const h=addSticky(paFrame(`${pAlert(false)}${pMini(true)}${paTickets(true)}${pPrz('gold',false)}`,true),pSticky(false));S.pmanual=false;return h}
if(sc==='claimsent')return addSticky(paFrame(`<div class="pa-alert sent"><div class="at">Claim sent. Checking…</div></div>${pMini(true,true)}${paTickets(true)}${pPrz('sent',false)}`,true),pSticky(true));
if(sc==='bogey')return addOverlay(paFrame(`${pMini(false)}${paTickets(true)}${pPrz('grey')}`,true),`<div class="pa-modal"><div class="pa-mb"><b>You have no claim right now.</b><p>If you submit, it counts as a wrong claim (Bogey).</p><div class="row"><button class="pa-btn alt" onclick="pgo('live')">Cancel</button><button class="pa-btn" onclick="pgo('claim','wrong')">Submit</button></div></div></div>`);
if(sc==='bystander'){const ph=S.pphase;const t=ph==='check'?'Ticket 52 has claimed Middle Line. Checking now…':ph==='ok'?'Ticket 52\'s claim is correct. Congratulations Ticket 52 on winning Middle Line! 🎉 The game continues.':ph==='wrong'?'Ticket 52\'s claim was not correct. The game continues.':'Middle Line has been won. It is no longer available.';
return paFrame(`${pToast(t,ph==='ok'?'ok':ph==='wrong'||ph==='gone'?'no':'')}${pMini(false)}${paTickets(true)}${pPrz('grey')}<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="pa-link" onclick="pgo('bystander','check')">Checking</button><button class="pa-link" onclick="pgo('bystander','ok')">Correct</button><button class="pa-link" onclick="pgo('bystander','wrong')">Not correct</button><button class="pa-link" onclick="pgo('bystander','gone')">Prize gone</button></div>`,true)}
if(sc==='ended'||sc==='endedwon'){const won=sc==='endedwon';const res=[['Early Five',41],['Top Line',7],['Middle Line',52],['Bottom Line',won?14:28],['1st Full House',33],['Lucky Draw 1',9]];const mine=res.filter(r=>r[1]===14).map(r=>r[0]);
return paFrame(`<div class="pa-end"><div class="pe-t">${won?'Congratulations! 🎉':'Thank you for playing!'}</div><p>${won?`You won <b>${mine.join(', ')}</b>. Your organizer will tell you how to collect your prize.`:'The game is over. Thank you for joining '+coName('your company')+'.'}</p></div><div class="pa-card pzc"><h3>FINAL RESULTS</h3>${res.map(r=>`<div class="pa-prz${r[1]===14?' me':''}"><div>${r[0]}</div><span class="pe-w">${r[1]===14?'You (Ticket 14)':'Ticket '+r[1]}</span></div>`).join('')}</div><div class="pa-endstat">${CALLED.length+37} of 90 numbers were called</div>${paTickets(true)}<div class="pa-small" style="text-align:center;margin:8px 12px 14px">Everything about you is deleted within 24 hours of the game.</div>`,true)}
return paScreenBase()}
function pScreen(){return paScreenNew()}
function rolebar(){if(!S.role)return'';const h=S.role==='host';return`<div class="rolebar"><span>${h?'🔑 You are a <b>Host</b>':'🤝 You are a <b>Co-host</b>'} of this game <em>${S.who.replace(/</g,'')}</em></span><button class="link" onclick="location.href='host.html'">Sign out</button></div>`+(h?`<div class="note ok" style="margin:0 0 14px">As a Host you can make any change in the game, just like the organizer, and you help run the game and let people in. The organizer and Hosts can also play the game.</div>`:`<div class="note" style="margin:0 0 14px"><b>What you can do:</b> help bring people to the game and let them in. <b>What you cannot do:</b> change the game, its prizes, date or payment.</div>`)}
function coShare(){const link='housie.corporatetambola.com/g/'+S.gid;return`<div class="sec" id="s-share" style="margin-top:6px"><h2>Your link to invite people to the game</h2><div class="size"><div><div class="why">Game link</div><b style="font-size:17px;word-break:break-all">${link}</b><div class="why" style="margin-top:6px">Game ID ${S.gid}. Everyone who joins using this link is recorded as a participant you invited.</div><div class="why" style="margin-top:6px"><b>You can invite up to ${capOf(S.who||'cohost@acme.com')} people.</b> Invited so far: ${34+S.wait.filter(x=>x.ref===(S.who||'cohost@acme.com')).length}. ${Math.max(0,capOf(S.who||'cohost@acme.com')-34-S.wait.filter(x=>x.ref===(S.who||'cohost@acme.com')).length)} left. This limit was set by ${S.by||'host@acme.com'}.</div></div><div style="flex:0;min-width:150px"><button class="btn" style="width:100%" onclick="toast('Link copied')">Copy link</button></div></div><div class="row" style="margin-top:10px"><button class="btn sec2" onclick="document.getElementById('msgbox').classList.toggle('hide')">Copy a message to share</button></div><div id="msgbox" class="pre hide" style="margin-top:8px">${msg()}<div style="margin-top:10px"><button class="btn" onclick="toast('Message copied')">Copy this message</button></div></div></div>`}
function coPay(){const done=S.paid||curSize()===10;return`<div class="sec" id="s-pay"><h2>Payment link</h2>${done?'<div class="note ok">✓ Payment received. Thank you.</div>':`<div class="row"><button class="btn sec2" onclick="toast('Payment link copied')">Copy payment link</button></div><div class="small">Share it with the person who will pay. The payment link works for 7 days.</div>`}</div>`}
function viewCo(){const me=S.who||'cohost@acme.com';return`<h1>Co-host screen</h1><p class="sub">Invite your team or location to the game, and let them in.</p>${coShare()}${waitBox(me)}`}
render();
</script></body></html>
