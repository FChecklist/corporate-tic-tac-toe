<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Host and Co-host screens (preview hub)</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1d1b3a;--mut:#6a6788;--line:#e4e0f5;--violet:#7a4cf0}
@media(prefers-color-scheme:dark){:root{--bg:#14122a;--card:#1e1b3d;--ink:#f1efff;--mut:#a9a5cf;--line:#37336a}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}header b{font-size:17px}.sp{flex:1}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:20px;font:inherit;cursor:pointer;margin-left:6px}.seg button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.wrap{flex:1;display:flex;min-height:0}nav{width:290px;overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:8px 10px}nav h3{margin:14px 6px 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
nav a{display:block;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);cursor:pointer}nav a:hover{background:rgba(122,76,240,.1)}nav a.on{background:var(--violet);color:#fff}
main{flex:1;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:14px}iframe{border:2px solid var(--line);border-radius:12px;background:#fff;height:calc(100vh - 110px);width:100%;max-width:100%}
.cap{font-size:13px;color:var(--mut);margin:0 0 8px}
@media(max-width:800px){.wrap{flex-direction:column}nav{width:100%;max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header><b>Host and Co-host screens</b><span class="cap" style="margin:0">Click any screen. Nothing needs to be typed.</span><span class="sp"></span><span class="seg"><button data-w="390" class="on">Phone</button><button data-w="820">Tablet</button><button data-w="100%">Laptop</button></span><a id="open" href="#" target="_blank" style="color:var(--violet)">Open in a new tab</a></header>
<div class="wrap"><nav id="nav"></nav><main><div style="width:100%;display:flex;flex-direction:column;align-items:center"><div class="cap" id="cap"></div><iframe id="f" title="Preview"></iframe></div></main></div>
<script>
const G=[
['HOST: sign in',[
['1. Game link: type your email ID','host.html'],
['2. Enter the 6-digit passcode','host.html?screen=passcode'],
['3. Wrong passcode message','host.html?screen=wrong'],
['4. Email not on the Host/Co-host list','host.html?screen=notlisted']]],
['HOST: game dashboard',[
['Dashboard, payment pending','index.html?role=host&email=host%40acme.com&state=unpaid'],
['Dashboard, paid (game is on)','index.html?role=host&email=host%40acme.com&state=paid'],
['Dashboard, start time passed','index.html?role=host&email=host%40acme.com&state=late'],
['Live game, auto mode (timer)','index.html?role=host&email=host%40acme.com&state=live'],
['Live game, manual mode (button)','index.html?role=host&email=host%40acme.com&state=live&mode=manual'],
['Paused game','index.html?role=host&email=host%40acme.com&state=paused'],
['A prize is being claimed (checking)','index.html?role=host&email=host%40acme.com&state=live&claim=check'],
['Claim is correct','index.html?role=host&email=host%40acme.com&state=live&claim=ok'],
['Prize is gone','index.html?role=host&email=host%40acme.com&state=live&claim=gone'],
['Game completed','index.html?role=host&email=host%40acme.com&state=completed']]],
['HOST: any change, like the organizer',[
['Step 1: Date and time','index.html?role=host&email=host%40acme.com&step=1'],
['Step 2: Who is it for','index.html?role=host&email=host%40acme.com&step=2'],
['Step 3: Tickets and prizes','index.html?role=host&email=host%40acme.com&step=3'],
['Step 4: Brand & Breaks','index.html?role=host&email=host%40acme.com&step=4'],
['Step 5: Check and publish','index.html?role=host&email=host%40acme.com&step=5']]],
['CO-HOST',[
['Sign in (same game link)','host.html?screen=cohost'],
['Co-host screen (people waiting)','index.html?role=cohost&email=ravi%40acme.com&state=live'],
['Co-host screen (nothing waiting)','index.html?role=cohost&email=ravi%40acme.com&state=live&empty=1']]],
['PARTICIPANT: the game (1.5.0 claim rules)',[
['1. Live game: no claim (grey CLAIM buttons)','index.html?role=player&screen=live&fam=0'],
['2. Grey CLAIM pressed: Bogey question','index.html?role=player&screen=bogey&fam=0'],
['3. YOU have a claim: gold top, side and bottom + timer','index.html?role=player&screen=claimwin&fam=0'],
['4. You have a claim (manual play: no timer)','index.html?role=player&screen=claimwinman&fam=0'],
['5. Two prizes on one number: both gold','index.html?role=player&screen=claimwin2&fam=0'],
['6. Claim sent. Checking...','index.html?role=player&screen=claimsent&fam=0'],
['7. Result: claim correct','index.html?role=player&screen=claim&phase=ok&fam=0'],
['8. Result: claim not correct','index.html?role=player&screen=claim&phase=wrong&fam=0'],
['9. Result: too late','index.html?role=player&screen=claim&phase=late&fam=0'],
['10. Result: prize already taken','index.html?role=player&screen=claim&phase=taken&fam=0'],
['11. SOMEONE ELSE claims: Ticket 52 has claimed...','index.html?role=player&screen=bystander&phase=check&fam=0'],
['11b. ...their claim is correct','index.html?role=player&screen=bystander&phase=ok&fam=0'],
['11c. ...prize has been won','index.html?role=player&screen=bystander&phase=gone&fam=0']]],
['PARTICIPANT: before, around and after',[
['A. Link opens: type your employee ID','index.html?role=player&screen=landing&fam=0'],
['A2. Type your email ID','index.html?role=player&screen=landing&fam=0&crit=email'],
['B. ID not on the list','index.html?role=player&screen=notlisted&fam=0'],
['C. Waiting for the organizer','index.html?role=player&screen=waiting&fam=0'],
['D. Ticket before the game starts','index.html?role=player&screen=before&fam=0'],
['E. Reconnecting','index.html?role=player&screen=reconnect&fam=0'],
['F. Back online','index.html?role=player&screen=back&fam=0'],
['G. Welcome back (away)','index.html?role=player&screen=away&fam=0'],
['H. Rehearsal game','index.html?role=player&screen=rehearsal&fam=0'],
['I. Game over: thank you (no prize)','index.html?role=player&screen=ended&fam=0'],
['I2. Game over: YOU WON','index.html?role=player&screen=endedwon&fam=0'],
['I3. Game over (Modern, you won)','index.html?role=player&screen=endedwon&fam=0&theme=modern'],
['J. TWO tickets (Ticket A / B, one greyed)','index.html?role=player&screen=live&fam=0&tix=2'],
['K. MODERN design: you have a claim','index.html?role=player&screen=claimwin&fam=0&theme=modern'],
['K2. MODERN design: two tickets','index.html?role=player&screen=live&fam=0&tix=2&theme=modern']]],
['PARTICIPANT with Family Passes',[
['1. Link opens: type your employee ID','index.html?role=player&screen=landing&fam=1'],
['2. Ticket + Family Passes (before game)','index.html?role=player&screen=before&fam=1'],
['3. Live game + Family Passes','index.html?role=player&screen=live&fam=1'],
['FAMILY MEMBER opens the family pass link','index.html?role=player&screen=famjoin&fam=1'],
['FAMILY MEMBER approved: ticket','index.html?role=player&screen=famok&fam=1']]],
['ORGANIZER (for comparison)',[
['Organizer, step 1','index.html'],
['Organizer, game dashboard','index.html?state=unpaid#d']]]];
const nav=document.getElementById('nav'),f=document.getElementById('f'),cap=document.getElementById('cap'),op=document.getElementById('open');let cur=null;
G.forEach(g=>{const h=document.createElement('h3');h.textContent=g[0];nav.appendChild(h);g[1].forEach(([t,u])=>{const a=document.createElement('a');a.textContent=t;a.onclick=()=>show(a,t,u);nav.appendChild(a)})});
function show(a,t,u){document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');cur=u;f.src=u+(u.includes('?')?'&':'?')+'v='+Date.now();cap.textContent=t;op.href=u}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.style.width=b.dataset.w==='100%'?'100%':b.dataset.w+'px'});
f.style.width='390px';nav.querySelector('a').click();
</script></body></html>
