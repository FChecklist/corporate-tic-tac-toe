<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light">
<title>Visits | Corporate Tic Tac Toe</title>
<link rel="icon" href="/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0B5D5B">
<style>body{font:14px/1.45 system-ui,sans-serif;margin:0;padding:16px;color:#14213d;background:#fff}h1{font-size:20px;margin:0 0 8px}h2{font-size:15px;margin:22px 0 6px}table{border-collapse:collapse;min-width:260px;max-width:100%}td,th{border-bottom:1px solid #e3e8f0;padding:4px 10px;text-align:left;vertical-align:top}th{font-weight:600;background:#F4F9F8}.n{text-align:right;font-variant-numeric:tabular-nums}form{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}input,button{font:inherit;padding:6px 10px}.muted{color:#5b6679}.wrap{overflow-x:auto}</style></head><body>
<h1>Visitor journeys</h1>
<p class="muted">Owner only. Paste the platform key to read the numbers; it stays in this page and is never saved.</p>
<form id="f"><input id="key" type="password" autocomplete="off" placeholder="Platform key" aria-label="Platform key"><input id="from" type="date" aria-label="From"><input id="to" type="date" aria-label="To"><button type="submit">Show</button></form>
<form id="jf"><input id="jid" autocomplete="off" placeholder="Visitor id, or ip_ and the address hash" aria-label="Visitor id or address hash" size="44"><button type="submit">Show one journey</button></form>
<p id="msg" class="muted" role="status"></p><div id="out"></div>
<h1 style="margin-top:28px">Owner desk</h1>
<p class="muted">Uses the same platform key as above.</p>
<p><button type="button" id="deskSite">Site switch</button> <input id="deskNote" autocomplete="off" placeholder="Note (optional)" aria-label="Note for the switch" size="24"></p>
<p><button type="button" id="deskReq">Data requests</button> <select id="deskStatus" aria-label="Which requests"><option value="open">open</option><option value="done">closed</option><option value="all">all</option></select></p>
<p><button type="button" id="deskMailEv">Mail events</button> <select id="deskEvent" aria-label="Which mail events"><option value="">all</option><option value="bounced">bounced</option><option value="complained">complained</option><option value="delivered">delivered</option></select> <button type="button" id="deskErr">Errors</button></p>
<form id="deskOrg"><input id="deskMail" type="email" autocomplete="off" placeholder="Organizer e-mail" aria-label="Organizer e-mail" size="30"><button type="submit">Find games</button></form>
<p id="deskmsg" class="muted" role="status"></p><div id="deskout"></div>
<script src="/owner-visits.js"></script>
<script src="/owner-desk.js"></script>
</body></html>
